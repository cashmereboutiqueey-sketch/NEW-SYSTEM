# Cashmere OS in production.
#
# Three services and nothing else. Caddy is the only one the internet can
# reach; the app is reachable only from Caddy, and the database only from the
# app. Nothing but 80 and 443 is published, so there is no port to forget to
# close.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Everything configurable lives in .env beside this file. It is never
# committed, and the deploy script refuses to run without it.
#
# Every service has a memory, CPU and process ceiling, and rotated logs. They
# share one machine of about 8 GB with no swap: without ceilings a runaway
# report or a log that never stops growing takes the database and the backups
# down with it. The figures leave room for the nightly backup's restore check
# and for a build during a deploy.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    container_name: cashmere-os-db
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      POSTGRES_USER: cashmere_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cashmere_os
      # Egyptian collation, so ORDER BY on an Arabic name sorts the way a
      # person reading the screen expects it to.
      LANG: C.UTF-8
    # No ports at all. The app reaches it over the private network by name;
    # nothing outside this file can open a connection to it, which is stronger
    # than binding to loopback and hoping.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashmere_os -d cashmere_os"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  # Migrations run here rather than in the app, from the build stage — which
  # already holds the full toolchain. The Prisma 7 CLI has a real dependency
  # tree of its own (effect, dotenv, and more beneath them), and copying those
  # into the runtime image one at a time is a game with no end: each missing
  # one only shows up as another crash loop. The slim runtime image exists
  # precisely so it does not carry build tooling, so the tooling stays here.
  #
  # It runs to completion and exits. The app waits for that exit to be a
  # success, so a failed migration stops the deploy instead of starting a
  # server against a half-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: cashmere-os-build:latest
    container_name: cashmere-os-migrate
    restart: "no"
    logging: *logging
    mem_limit: 1g
    environment:
      # The owner: migrations change structure, which the app must not.
      DATABASE_URL: postgresql://cashmere_os:${POSTGRES_PASSWORD}@db:5432/cashmere_os?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # Then the app's own login and its grants, so tables a migration adds are
    # usable at once. See scripts/ensure-app-role.mjs.
    command: ["sh", "-c", "npx prisma migrate deploy && node scripts/ensure-app-role.mjs"]
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cashmere-os:latest
    container_name: cashmere-os-app
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      # Not the owner. cashmere_app reads and writes rows and nothing else — it
      # cannot alter a table, switch off a trigger or create a login.
      DATABASE_URL: postgresql://cashmere_app:${APP_DB_PASSWORD}@db:5432/cashmere_os?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Opens the Shopify credentials sealed in the database. Kept here and not
      # there, so a copy of the database or a backup does not give them away.
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:?set INTEGRATION_SECRET_KEY in .env}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ar}
      NODE_ENV: production
      UPLOAD_DIR: /app/data/uploads
      TZ: Africa/Cairo
    volumes:
      # Garment photographs. A named volume, so rebuilding the image — which
      # happens on every deploy — cannot take them with it.
      - uploads:/app/data/uploads
    # Migrations before the first request, never alongside it: a request
    # arriving mid-migration reads a half-changed schema.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/health asks the database, not just the web server: a login page
      # renders happily while every screen behind it is failing.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    container_name: cashmere-os-caddy
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account key. Losing this volume means asking
      # Let's Encrypt for a new certificate on the next start, and they rate
      # limit that — five a week for the same name.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks: [internal]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
